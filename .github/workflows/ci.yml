name: CI

on:
  push:
    branches: [ master, 'claude/**' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-nogui:
    name: Linux (nogui + tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          git \
          autoconf \
          texinfo \
          libdbus-1-dev \
          libglu1-mesa-dev \
          libgl-dev \
          zlib1g-dev \
          m4

    - name: Cache dependencies
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: deps/build/destdir
        key: deps-linux-nogui-v2-${{ hashFiles('deps/+*/**.cmake', 'deps/CMakeLists.txt', 'deps/CMakePresets.json') }}

    - name: Build dependencies
      if: steps.cache-deps.outputs.cache-hit != 'true'
      run: |
        cd deps
        mkdir -p build && cd build
        cmake .. \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DDEP_WX_GTK3=OFF \
          -DPrusaSlicer_deps_PACKAGE_EXCLUDES="wxWidgets|OCCT|OpenCSG"
        ninja -j $(nproc)

    - name: Configure PrusaSlicer
      run: |
        mkdir -p build && cd build
        cmake .. \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DSLIC3R_STATIC=1 \
          -DSLIC3R_GUI=0 \
          -DSLIC3R_BUILD_TESTS=ON \
          -DSLIC3R_ENABLE_FORMAT_STEP=OFF \
          -DCMAKE_PREFIX_PATH="$(pwd)/../deps/build/destdir/usr/local"

    - name: Build PrusaSlicer
      run: |
        cd build
        ninja -j $(nproc)

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure -j $(nproc)

  build-linux-nogui-lto:
    name: Linux (nogui + LTO)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: build-linux-nogui

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          git \
          autoconf \
          texinfo \
          libdbus-1-dev \
          libglu1-mesa-dev \
          libgl-dev \
          zlib1g-dev \
          m4

    - name: Cache dependencies
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: deps/build/destdir
        key: deps-linux-nogui-v2-${{ hashFiles('deps/+*/**.cmake', 'deps/CMakeLists.txt', 'deps/CMakePresets.json') }}

    - name: Build dependencies
      if: steps.cache-deps.outputs.cache-hit != 'true'
      run: |
        cd deps
        mkdir -p build && cd build
        cmake .. \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DDEP_WX_GTK3=OFF \
          -DPrusaSlicer_deps_PACKAGE_EXCLUDES="wxWidgets|OCCT|OpenCSG"
        ninja -j $(nproc)

    - name: Configure PrusaSlicer with LTO
      run: |
        mkdir -p build && cd build
        cmake .. \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DSLIC3R_STATIC=1 \
          -DSLIC3R_GUI=0 \
          -DSLIC3R_LTO=ON \
          -DSLIC3R_BUILD_TESTS=OFF \
          -DSLIC3R_ENABLE_FORMAT_STEP=OFF \
          -DCMAKE_PREFIX_PATH="$(pwd)/../deps/build/destdir/usr/local"

    - name: Build PrusaSlicer with LTO
      run: |
        cd build
        ninja -j $(nproc)
